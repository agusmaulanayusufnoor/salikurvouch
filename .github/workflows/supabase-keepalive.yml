name: Supabase Keep-Alive (Anti Auto-Pause)

on:
  schedule:
    # Runs every 3 days at 02:00 UTC (09:00 WIB) — well below Supabase's 7-day auto-pause window
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping SalikurVouch Keep-Alive Endpoint or Supabase REST
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_URL:-}" ]; then
            echo "Pinging primary keep-alive endpoint..."
            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET:-}" \
              "${APP_URL%/}/api/health/keep-alive")
            BODY=$(echo "$RESPONSE" | sed '$d')
            CODE=$(echo "$RESPONSE" | tail -n1)
            echo "HTTP $CODE: $BODY"
            if [ "$CODE" -ne 200 ]; then
              echo "Keep-alive ping failed with HTTP $CODE"
              exit 1
            fi
          elif [ -n "${SUPABASE_URL:-}" ] && [ -n "${SERVICE_KEY:-}" ]; then
            echo "APP_URL not set; running direct Supabase REST fallback ping..."
            NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH \
              -H "apikey: ${SERVICE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"last_keepalive_at\":\"${NOW_ISO}\"}" \
              "${SUPABASE_URL%/}/rest/v1/app_settings?id=eq.1")
            echo "Direct Supabase PATCH HTTP $CODE at $NOW_ISO"
            if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
              exit 1
            fi
          else
            echo "Neither APP_URL nor NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY secrets are configured."
            exit 1
          fi
